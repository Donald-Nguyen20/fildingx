<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Orb — Fluorescence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;padding:16px 12px 14px;gap:12px}
canvas#jc{display:block}
#lbl{font-family:monospace;font-size:11px;letter-spacing:.15em;color:rgba(8,145,158,.8);text-align:center;min-height:16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-family:monospace;font-size:10px;letter-spacing:.08em;padding:6px 16px;border-radius:16px;border:1px solid rgba(8,145,158,.28);background:rgba(8,145,158,.06);color:rgba(8,145,158,.80);cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(8,145,158,.18);border-color:rgba(8,145,158,.55);color:#07919c}
.btn.active{background:rgba(8,145,158,.20);border-color:#08919c;color:#057882}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="jc" width="620" height="560"></canvas>
  <div id="lbl">RESTING STATE — LOW FREQUENCY</div>
  <div class="ctrl">
    <button class="btn active" id="b0" onclick="setS(0)">REST</button>
    <button class="btn"        id="b1" onclick="setS(1)">FOCUS</button>
    <button class="btn"        id="b2" onclick="setS(2)">THINK</button>
    <button class="btn"        id="b3" onclick="setS(3)">CREATIVE</button>
    <button class="btn"        id="b4" onclick="setS(4)">OVERLOAD</button>
  </div>
</div>

<script>
// ============================================================
//  Neural Orb — Fluorescence microscopy aesthetic
//  Wavy organic dendrites + shadowBlur soft glow on light bg.
//
//  PySide6 API:
//    view.page().runJavaScript("setS(0)")  // REST
//    view.page().runJavaScript("setS(1)")  // FOCUS
//    view.page().runJavaScript("setS(2)")  // THINK
//    view.page().runJavaScript("setS(3)")  // CREATIVE
//    view.page().runJavaScript("setS(4)")  // OVERLOAD
// ============================================================

const cv  = document.getElementById('jc');
const ctx = cv.getContext('2d');
const W = 620, H = 560, CX = 310, CY = 280;

// Vivid palette — đậm hơn để nổi trên nền desktop trong suốt
const STATES = [
  { label:'RESTING STATE — LOW FREQUENCY', colA:[0,200,215],  colB:[30,90,255],  speed:.50, fire:.18, conn:55,  axonSpd:.65, waveAmp:.60, driftMul:1.2 },
  { label:'FOCUSED — PREFRONTAL ACTIVE',   colA:[20,120,255], colB:[0,230,240],  speed:1.1, fire:.42, conn:85,  axonSpd:1.3, waveAmp:.78, driftMul:1.8 },
  { label:'DEEP THINK — FULL CORTEX',      colA:[130,0,255],  colB:[230,0,190],  speed:2.4, fire:.72, conn:118, axonSpd:2.2, waveAmp:1.08,driftMul:2.8 },
  { label:'CREATIVE — DIFFUSE MODE',       colA:[0,210,160],  colB:[240,175,0],  speed:1.7, fire:.58, conn:98,  axonSpd:1.7, waveAmp:.95, driftMul:2.2 },
  { label:'OVERLOAD — GAMMA BURST',        colA:[255,30,30],  colB:[255,220,0],  speed:4.0, fire:.98, conn:150, axonSpd:3.8, waveAmp:1.50,driftMul:4.0 },
];

let cur=0, nxt=0, bl=1, t=0;
let _autoCycle=null, _cycleIdx=0;
const ss  = x => { x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); };
const lrp = (a,b,f) => a+(b-a)*f;
const lrpC= (a,b,f) => a.map((v,i)=>v+(b[i]-v)*f);
const rnd = (n,s=1) => { let x=Math.sin(n*127.1+s*311.7)*43758.5453; return x-Math.floor(x); };

function setS(i){
  cur=nxt; nxt=i; bl=0;
  document.querySelectorAll('.btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.getElementById('lbl').textContent=STATES[i].label;
}

// Auto-cycle: chuyển sang state tiếp theo mỗi ~8s, blend mượt
function startAutoCycle(intervalMs){
  if(_autoCycle) clearInterval(_autoCycle);
  _autoCycle=setInterval(()=>{
    _cycleIdx=(_cycleIdx+1)%STATES.length;
    setS(_cycleIdx);
  }, intervalMs||8000);
}
function stopAutoCycle(){ if(_autoCycle){ clearInterval(_autoCycle); _autoCycle=null; } }

// Wavy line — sinusoidal displacement perpendicular to direction, tapers at endpoints
function wavyLine(x1,y1,x2,y2,amp,phase){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy);
  if(len<1) return;
  const nx=-dy/len, ny=dx/len;
  const steps=Math.max(3,Math.floor(len/9));
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const s=i/steps;
    const env=Math.sin(s*Math.PI); // taper to 0 at both ends
    const w=Math.sin(s*Math.PI*2.5+phase)*amp*env;
    const px=x1+dx*s+nx*w, py=y1+dy*s+ny*w;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();
}

// --- Neurons (320, same positions) ---
const NEURONS=[];
for(let i=0;i<320;i++){
  const a=rnd(i,1)*Math.PI*2, r=10+rnd(i,2)*265;
  const px=CX+Math.cos(a)*r, py=CY+Math.sin(a)*r*(.88+rnd(i,11)*.24);
  NEURONS.push({
    px,py,ox:px,oy:py,x:px,y:py,
    sz:.8+rnd(i,3)*2.8, phase:rnd(i,4)*Math.PI*2, fireSpd:.3+rnd(i,6)*3.2,
    firing:0, fireCooldown:0,
    driftA:rnd(i,7)*Math.PI*2, driftB:rnd(i,12)*Math.PI*2, driftC:rnd(i,13)*Math.PI*2,
    driftSpd:.2+rnd(i,8)*.9, driftR:12+rnd(i,9)*32,
    dendrites:[],
  });
}

// Dendrites — fewer branches, longer, wavy amplitude stored per branch
NEURONS.forEach((n,ni)=>{
  const bc=3+Math.floor(rnd(ni,50)*3); // 3-5 main branches (was 4-10)
  for(let b=0;b<bc;b++){
    // roughly evenly spread with jitter — avoids the uniform spoke look
    const baseAngle=(b/bc)*Math.PI*2+(rnd(ni*10+b,56)-.5)*1.2;
    const len=16+rnd(ni*10+b,52)*42; // longer: 16-58px
    const wavAmp=2+rnd(ni*10+b,57)*7; // per-branch wave amplitude
    const wavPhase=rnd(ni*10+b,58)*Math.PI*2;
    const subs=[];
    for(let s=0;s<Math.floor(rnd(ni*10+b,53)*3);s++){
      subs.push({
        da:baseAngle+(rnd(ni*100+b*10+s,54)-.5)*.95,
        dl:len*(.22+rnd(ni*100+b*10+s,55)*.45),
        wavAmp:1.2+rnd(ni*100+b*10+s,59)*3.5,
        wavPhase:rnd(ni*100+b*10+s,60)*Math.PI*2,
      });
    }
    n.dendrites.push({a:baseAngle,len,subs,wavAmp,wavPhase});
  }
});

// --- Synapses — store individual curvature so connections vary naturally ---
const SYNAPSES=[];
for(let i=0;i<NEURONS.length;i++){
  const ni=NEURONS[i], conns=2+Math.floor(rnd(i,30)*4);
  const nearby=NEURONS.map((n,j)=>({j,d:Math.hypot(n.px-ni.px,n.py-ni.py)}))
    .filter(x=>x.j!==i&&x.d<150).sort((a,b)=>a.d-b.d).slice(0,14);
  for(let c=0;c<conns;c++){
    const pick=nearby[Math.floor(rnd(i*10+c,32)*nearby.length)];
    if(!pick) continue;
    if(SYNAPSES.find(s=>s.from===i&&s.to===pick.j)) continue;
    SYNAPSES.push({
      from:i, to:pick.j, pulses:[], phase:rnd(i*10+c,35)*Math.PI*2, dist:pick.d,
      // curvature varies: -0.18..+0.18, some nearly straight, some left/right curve
      curv:(rnd(i*10+c,36)-.5)*.36,
    });
  }
}

function triggerFire(nIdx){
  const n=NEURONS[nIdx];
  if(!n||n.firing>0||n.fireCooldown>0) return;
  n.firing=.01; n.fireCooldown=18+Math.random()*45;
  SYNAPSES.filter(s=>s.from===nIdx).forEach(s=>{
    s.pulses.push({prog:0,spd:.012+Math.random()*.026});
  });
}

// Streaming intensity — Python gọi mỗi ~200ms khi token đang chảy về.
// intensity: 0..1 (tỉ lệ với tốc độ token). Tạo burst neuron firing tức thời
// + boost cường độ tạm thời (tự decay trong frame loop).
let _streamBoost=0;
function streamPulse(intensity){
  intensity=Math.max(0,Math.min(1,intensity));
  _streamBoost=Math.max(_streamBoost,intensity);
  const burst=Math.floor(intensity*6);
  if(burst<=0) return;
  const eligible=NEURONS.filter(n=>n.firing===0&&n.fireCooldown<=0);
  for(let k=0;k<burst&&eligible.length;k++){
    const idx=Math.floor(Math.random()*eligible.length);
    triggerFire(NEURONS.indexOf(eligible[idx]));
    eligible.splice(idx,1);
  }
}

let fireTimer=0;

// --- Main loop ---
function frame(){
  requestAnimationFrame(frame);
  t+=.016;
  if(bl<1) bl=Math.min(1,bl+.008);  // ~2.5s blend mượt giữa các state
  if(_streamBoost>0) _streamBoost=Math.max(0,_streamBoost-.012);  // decay ~1.3s
  const f=ss(bl);
  const sA=STATES[cur], sB=STATES[nxt];
  const colA    =lrpC(sA.colA,   sB.colA,   f);
  const colB    =lrpC(sA.colB,   sB.colB,   f);
  const spd     =lrp(sA.speed,   sB.speed,   f);
  const fireRate=lrp(sA.fire,    sB.fire,    f);
  const connC   =Math.round(lrp(sA.conn,    sB.conn,    f));
  const axonSpd =lrp(sA.axonSpd, sB.axonSpd, f);
  const waveAmp =lrp(sA.waveAmp, sB.waveAmp, f);
  const driftMul=lrp(sA.driftMul,sB.driftMul,f);
  const csA=colA.map(Math.round).join(',');
  const csB=colB.map(Math.round).join(',');
  // bright firing color: shift toward lighter/more saturated
  const csFire=colA.map((v,i)=>{
    const target=i===1?Math.min(255,colA[1]+80):i===2?Math.min(255,colA[2]+80):Math.min(255,colA[0]+60);
    return Math.round(v+(target-v)*.6);
  }).join(',');

  // Update neurons
  NEURONS.forEach(n=>{
    if(n.firing>0)       n.firing=Math.min(1,n.firing+.05*spd);
    if(n.fireCooldown>0) n.fireCooldown-=spd;
    n.driftA+=n.driftSpd*.016*spd;
    n.driftB+=n.driftSpd*.010*spd*1.3;
    n.driftC+=n.driftSpd*.006*spd*1.7;
    const dr=n.driftR*driftMul*.012;
    const ox=Math.cos(n.driftA)*dr*n.driftR+Math.cos(n.driftB)*dr*n.driftR*.55+Math.cos(n.driftC)*dr*n.driftR*.30;
    const oy=Math.sin(n.driftA)*dr*n.driftR+Math.sin(n.driftB)*dr*n.driftR*.55+Math.sin(n.driftC)*dr*n.driftR*.30;
    n.x+=(n.ox+ox-n.x)*.04;
    n.y+=(n.oy+oy-n.y)*.04;
  });

  fireTimer-=spd;
  if(fireTimer<=0){
    fireTimer=.8+Math.random()*(4/fireRate);
    const eligible=NEURONS.filter(n=>n.firing===0&&n.fireCooldown<=0);
    const fc=1+Math.floor(fireRate*3);
    for(let k=0;k<fc&&eligible.length;k++){
      const idx=Math.floor(Math.random()*eligible.length);
      triggerFire(NEURONS.indexOf(eligible[idx])); eligible.splice(idx,1);
    }
  }
  SYNAPSES.forEach(s=>{
    s.pulses=s.pulses.filter(p=>{
      p.prog+=p.spd*axonSpd;
      if(p.prog>=1){triggerFire(s.to);return false;}
      return true;
    });
  });

  // ── Draw ─────────────────────────────────────────────────

  // Transparent background + subtle center tint
  ctx.clearRect(0,0,W,H);
  const vtx=ctx.createRadialGradient(CX,CY,0,CX,CY,260);
  vtx.addColorStop(0, `rgba(${csA},0.028)`);
  vtx.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=vtx; ctx.fillRect(0,0,W,H);

  // ── Synapses — thin (0.5px), no shadowBlur (perf), varied curvature ──
  let drawn=0;
  SYNAPSES.forEach(s=>{
    if(drawn>=connC*3) return;
    const na=NEURONS[s.from], nb=NEURONS[s.to];
    const bright  =.10+Math.sin(t*spd*.5+s.phase)*waveAmp*.14;
    const distFade=Math.max(0,1-s.dist/155);
    const alpha   =Math.min(.50,bright*distFade*5.0);
    if(alpha<.018){drawn++;return;}

    const mx=(na.x+nb.x)/2+(na.y-nb.y)*s.curv;
    const my=(na.y+nb.y)/2+(nb.x-na.x)*s.curv;

    ctx.strokeStyle=`rgba(${csA},${alpha.toFixed(3)})`;
    ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(na.x,na.y);
    ctx.quadraticCurveTo(mx,my,nb.x,nb.y);
    ctx.stroke();

    // Pulse dot — shadowBlur only here (few per frame, high impact)
    s.pulses.forEach(p=>{
      const mt=p.prog;
      const px=na.x*(1-mt)*(1-mt)+mx*2*mt*(1-mt)+nb.x*mt*mt;
      const py=na.y*(1-mt)*(1-mt)+my*2*mt*(1-mt)+nb.y*mt*mt;
      const dc=Math.hypot(px-CX,py-CY), df=Math.max(0,1-dc/285);
      ctx.save();
      ctx.shadowColor=`rgba(${csFire},${.82*df})`;
      ctx.shadowBlur=8+waveAmp*4;
      ctx.fillStyle=`rgba(${csFire},${.90*df})`;
      ctx.beginPath(); ctx.arc(px,py,2.2+waveAmp*.8,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    drawn++;
  });

  // ── Dendrites — wavy sinusoidal, no shadowBlur (perf) ──
  NEURONS.forEach(n=>{
    const distC=Math.hypot(n.x-CX,n.y-CY), fade=Math.max(0,1-distC/285);
    if(fade<.05) return;
    const fireG=(n.firing>0&&n.firing<1)?Math.sin(n.firing*Math.PI):0;
    const alpha=(.32+fireG*.55)*fade;

    ctx.strokeStyle=`rgba(${csA},${alpha.toFixed(3)})`;
    n.dendrites.forEach(d=>{
      const wobble=Math.sin(t*spd*.7+n.phase+d.a)*waveAmp*.8;
      const ex=n.x+Math.cos(d.a+wobble*.035)*d.len;
      const ey=n.y+Math.sin(d.a+wobble*.035)*d.len;
      ctx.lineWidth=1.3;
      wavyLine(n.x,n.y,ex,ey, d.wavAmp*(0.5+waveAmp*.55), d.wavPhase+t*spd*.25);
      d.subs.forEach(sb=>{
        const smx=n.x+Math.cos(d.a)*d.len*.45, smy=n.y+Math.sin(d.a)*d.len*.45;
        ctx.lineWidth=0.7;
        wavyLine(smx,smy, smx+Math.cos(sb.da)*sb.dl, smy+Math.sin(sb.da)*sb.dl,
          sb.wavAmp*(0.4+waveAmp*.45), sb.wavPhase+t*spd*.18);
      });
    });
  });

  // ── Cell bodies — shadowBlur only when actually firing ──
  NEURONS.slice().sort((a,b)=>a.firing-b.firing).forEach(n=>{
    const distC=Math.hypot(n.x-CX,n.y-CY), fade=Math.max(0,1-distC/280);
    if(fade<.05) return;
    const isFiring=n.firing>0&&n.firing<1;
    const fireG=isFiring?Math.sin(n.firing*Math.PI):0;
    const pulse=.28+Math.sin(t*spd*n.fireSpd+n.phase)*waveAmp*.28;
    const sz=n.sz*(.55+pulse*.50+fireG*.90);
    const alpha=Math.min(.95,(.48+pulse*.42+fireG*.88)*fade);

    if(fireG>.06){
      ctx.save();
      ctx.shadowColor=`rgba(${csFire},${(fireG*.88*fade).toFixed(3)})`;
      ctx.shadowBlur=sz*12*(1+waveAmp*.25)*fireG;
      ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(.4,sz*.80),0,Math.PI*2);
      ctx.fillStyle=`rgba(${csFire},${alpha})`;
      ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(n.x,n.y,Math.max(.4,sz*.80),0,Math.PI*2);
      ctx.fillStyle=`rgba(${csA},${alpha})`;
      ctx.fill();
    }
  });

  // ── Core — pulsing depth focal point (mạnh hơn khi đang stream) ──
  const cp=(.68+_streamBoost*.22)+Math.sin(t*3.2)*waveAmp*.38;
  [[88,.022],[58,.048],[32,.110],[16,.240],[7,.460],[3,.800]].forEach(([r,a])=>{
    const g=ctx.createRadialGradient(CX,CY,0,CX,CY,r*cp);
    g.addColorStop(0,`rgba(${csA},${Math.min(1,a*1.7*cp)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,r*cp,0,Math.PI*2); ctx.fill();
  });
  ctx.save();
  ctx.shadowColor=`rgba(${csA},0.85)`; ctx.shadowBlur=9;
  ctx.beginPath(); ctx.arc(CX,CY,2.6,0,Math.PI*2);
  ctx.fillStyle=`rgba(${csA},${.90+Math.sin(t*4.5)*.10})`; ctx.fill();
  ctx.restore();
}

frame();
// Orb phản ánh trạng thái thật của app (do Python điều khiển qua setS()).
// KHÔNG auto-cycle — bắt đầu ở REST, chờ tín hiệu thật.
setS(0);
</script>
</body>
</html>
