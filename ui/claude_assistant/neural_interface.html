<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Neural Orb v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif}
#wrap{display:flex;flex-direction:column;align-items:center;padding:16px 12px 14px;gap:12px}
canvas#jc{display:block}
#lbl{font-family:monospace;font-size:11px;letter-spacing:.15em;color:rgba(60,100,200,.65);text-align:center;min-height:16px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font-family:monospace;font-size:10px;letter-spacing:.08em;padding:6px 16px;border-radius:16px;border:1px solid rgba(80,140,220,.25);background:rgba(80,140,220,.07);color:rgba(60,100,200,.75);cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(80,140,220,.18);border-color:rgba(80,140,220,.55);color:#2255bb}
.btn.active{background:rgba(60,120,220,.18);border-color:#4488dd;color:#1144aa}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="jc" width="620" height="560"></canvas>
  <div id="lbl">RESTING STATE — LOW FREQUENCY</div>
  <div class="ctrl">
    <button class="btn active" id="b0" onclick="setS(0)">REST</button>
    <button class="btn" id="b1" onclick="setS(1)">FOCUS</button>
    <button class="btn" id="b2" onclick="setS(2)">THINK</button>
    <button class="btn" id="b3" onclick="setS(3)">CREATIVE</button>
    <button class="btn" id="b4" onclick="setS(4)">OVERLOAD</button>
  </div>
</div>

<script>
// ============================================================
//  JARVIS Neural Orb v2 — wide, fast, organic motion
//
//  PySide6 API:
//    view.page().runJavaScript("setS(0)")  // REST
//    view.page().runJavaScript("setS(1)")  // FOCUS
//    view.page().runJavaScript("setS(2)")  // THINK
//    view.page().runJavaScript("setS(3)")  // CREATIVE
//    view.page().runJavaScript("setS(4)")  // OVERLOAD
// ============================================================

const cv = document.getElementById('jc');
const ctx = cv.getContext('2d');
const W = 620, H = 560, CX = 310, CY = 280;

// --- States ---
const STATES = [
  { label: 'RESTING STATE — LOW FREQUENCY',  colA: [40,120,255],  colB: [80,50,200],  speed: .50, fire: .14, conn: 50,  axonSpd: .60, waveAmp: .55, driftMul: 1.2 },
  { label: 'FOCUSED — PREFRONTAL ACTIVE',    colA: [30,190,255],  colB: [20,230,190], speed: 1.1, fire: .38, conn: 80,  axonSpd: 1.3, waveAmp: .75, driftMul: 1.8 },
  { label: 'DEEP THINK — FULL CORTEX',       colA: [160,60,255],  colB: [255,80,200], speed: 2.4, fire: .68, conn: 115, axonSpd: 2.2, waveAmp: 1.05,driftMul: 2.8 },
  { label: 'CREATIVE — DIFFUSE MODE',        colA: [255,150,20],  colB: [255,60,130], speed: 1.7, fire: .55, conn: 95,  axonSpd: 1.7, waveAmp: .92, driftMul: 2.2 },
  { label: 'OVERLOAD — GAMMA BURST',         colA: [255,40,40],   colB: [255,210,20], speed: 4.0, fire: .98, conn: 150, axonSpd: 3.8, waveAmp: 1.50,driftMul: 4.0 },
];

let cur = 0, nxt = 0, bl = 1, t = 0;

function ss(x)        { x = Math.max(0, Math.min(1,x)); return x*x*(3-2*x); }
function lrp(a,b,f)   { return a + (b-a)*f; }
function lrpC(a,b,f)  { return a.map((v,i) => v + (b[i]-v)*f); }

// Public — callable from PySide6
function setS(i) {
  cur = nxt; nxt = i; bl = 0;
  document.querySelectorAll('.btn').forEach((b,j) => b.classList.toggle('active', j===i));
  document.getElementById('lbl').textContent = STATES[i].label;
}

// Seeded deterministic random
const rnd = (n, s=1) => {
  let x = Math.sin(n*127.1 + s*311.7) * 43758.5453;
  return x - Math.floor(x);
};

// --- Build neurons (320, spread ~270px) ---
const NEURONS = [];
const N_COUNT = 320;
for (let i = 0; i < N_COUNT; i++) {
  const a  = rnd(i,1) * Math.PI * 2;
  const r  = 10 + rnd(i,2) * 265;
  const px = CX + Math.cos(a) * r;
  const py = CY + Math.sin(a) * r * (0.88 + rnd(i,11)*.24);
  NEURONS.push({
    px, py, ox: px, oy: py, x: px, y: py,
    sz:      .7 + rnd(i,3)*3.0,
    phase:   rnd(i,4)*Math.PI*2,
    fireSpd: .3 + rnd(i,6)*3.2,
    firing: 0, fireCooldown: 0,
    driftA:    rnd(i,7)*Math.PI*2,
    driftB:    rnd(i,12)*Math.PI*2,
    driftC:    rnd(i,13)*Math.PI*2,
    driftSpd:  .2 + rnd(i,8)*.9,
    driftR:    12 + rnd(i,9)*32,
    dendrites: [],
  });
}

// Dendrites — longer, more sub-branches
NEURONS.forEach((n, ni) => {
  const bc = 4 + Math.floor(rnd(ni,50)*6);
  for (let b = 0; b < bc; b++) {
    const a   = rnd(ni*10+b, 51) * Math.PI*2;
    const len = 8 + rnd(ni*10+b, 52) * 28;
    const subs = [];
    const sc = Math.floor(rnd(ni*10+b, 53)*4);
    for (let s = 0; s < sc; s++) {
      subs.push({
        da: a + (rnd(ni*100+b*10+s, 54) - .5)*1.3,
        dl: len*(.3 + rnd(ni*100+b*10+s, 55)*.6),
      });
    }
    n.dendrites.push({ a, len, subs });
  }
});

// Synapses — wider connection radius (155px)
const SYNAPSES = [];
for (let i = 0; i < NEURONS.length; i++) {
  const ni = NEURONS[i];
  const conns = 2 + Math.floor(rnd(i,30)*5);
  const nearby = NEURONS
    .map((n,j) => ({ j, d: Math.hypot(n.px-ni.px, n.py-ni.py) }))
    .filter(x => x.j !== i && x.d < 155)
    .sort((a,b) => a.d - b.d)
    .slice(0, 16);
  for (let c = 0; c < conns; c++) {
    const pick = nearby[Math.floor(rnd(i*10+c, 32)*nearby.length)];
    if (!pick) continue;
    if (SYNAPSES.find(s => s.from===i && s.to===pick.j)) continue;
    SYNAPSES.push({ from: i, to: pick.j, pulses: [], phase: rnd(i*10+c,35)*Math.PI*2, dist: pick.d });
  }
}

// Fire cascade
function triggerFire(nIdx) {
  const n = NEURONS[nIdx];
  if (!n || n.firing > 0 || n.fireCooldown > 0) return;
  n.firing = .01;
  n.fireCooldown = 18 + Math.random()*45;
  SYNAPSES.filter(s => s.from === nIdx).forEach(s => {
    s.pulses.push({ prog: 0, spd: .012 + Math.random()*.026 });
  });
}

let fireTimer = 0;

// --- Main loop ---
function frame() {
  requestAnimationFrame(frame);
  t += .016;
  if (bl < 1) bl = Math.min(1, bl + .03);
  const f = ss(bl);
  const sA = STATES[cur], sB = STATES[nxt];

  const colA     = lrpC(sA.colA,    sB.colA,    f);
  const colB     = lrpC(sA.colB,    sB.colB,    f);
  const spd      = lrp(sA.speed,    sB.speed,    f);
  const fireRate = lrp(sA.fire,     sB.fire,     f);
  const connC    = Math.round(lrp(sA.conn,     sB.conn,     f));
  const axonSpd  = lrp(sA.axonSpd,  sB.axonSpd, f);
  const waveAmp  = lrp(sA.waveAmp,  sB.waveAmp, f);
  const driftMul = lrp(sA.driftMul, sB.driftMul,f);
  const csA = colA.map(Math.round).join(',');
  const csB = colB.map(Math.round).join(',');

  // Update neurons — 3 overlapping drift waves
  NEURONS.forEach(n => {
    if (n.firing > 0)       n.firing = Math.min(1, n.firing + .05*spd);
    if (n.fireCooldown > 0) n.fireCooldown -= spd;

    n.driftA += n.driftSpd * .008 * spd;
    n.driftB += n.driftSpd * .005 * spd * 1.3;
    n.driftC += n.driftSpd * .003 * spd * 1.7;

    const dr = n.driftR * driftMul * .012;
    const ox = Math.cos(n.driftA)*dr*n.driftR
             + Math.cos(n.driftB)*dr*n.driftR*.55
             + Math.cos(n.driftC)*dr*n.driftR*.30;
    const oy = Math.sin(n.driftA)*dr*n.driftR
             + Math.sin(n.driftB)*dr*n.driftR*.55
             + Math.sin(n.driftC)*dr*n.driftR*.30;

    n.x += (n.ox + ox - n.x) * .04;
    n.y += (n.oy + oy - n.y) * .04;
  });

  // Spontaneous multi-fire
  fireTimer -= spd;
  if (fireTimer <= 0) {
    fireTimer = .8 + Math.random() * (4 / fireRate);
    const eligible = NEURONS.filter(n => n.firing === 0 && n.fireCooldown <= 0);
    const fireCnt = 1 + Math.floor(fireRate * 3);
    for (let k = 0; k < fireCnt && eligible.length; k++) {
      const idx = Math.floor(Math.random() * eligible.length);
      triggerFire(NEURONS.indexOf(eligible[idx]));
      eligible.splice(idx, 1);
    }
  }

  // Update pulses
  SYNAPSES.forEach(s => {
    s.pulses = s.pulses.filter(p => {
      p.prog += p.spd * axonSpd;
      if (p.prog >= 1) { triggerFire(s.to); return false; }
      return true;
    });
  });

  // --- Draw ---
  ctx.clearRect(0, 0, W, H);

  // Multi-layer ambient glow
  [[300,.06],[200,.04],[120,.025],[60,.015]].forEach(([r,a]) => {
    const g = ctx.createRadialGradient(CX,CY,0, CX,CY,r);
    g.addColorStop(0,   `rgba(${csA},${a})`);
    g.addColorStop(.5,  `rgba(${csB},${a*.4})`);
    g.addColorStop(1,   'rgba(240,244,248,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  });

  // Synapses + pulses
  let drawn = 0;
  SYNAPSES.forEach(s => {
    if (drawn >= connC*3) return;
    const na = NEURONS[s.from], nb = NEURONS[s.to];
    const bright    = .05 + Math.sin(t*spd*.5 + s.phase) * waveAmp * .10;
    const distFade  = Math.max(0, 1 - s.dist/160);
    const alpha     = Math.min(.55, bright * distFade * 2);
    if (alpha < .018) { drawn++; return; }

    const mx = (na.x+nb.x)/2 + (na.y-nb.y)*.14;
    const my = (na.y+nb.y)/2 + (nb.x-na.x)*.14;
    ctx.beginPath();
    ctx.moveTo(na.x, na.y);
    ctx.quadraticCurveTo(mx, my, nb.x, nb.y);
    ctx.strokeStyle = `rgba(${csA},${alpha})`;
    ctx.lineWidth = .4; ctx.stroke();

    s.pulses.forEach(p => {
      const mt = p.prog;
      const px = na.x*(1-mt)*(1-mt) + mx*2*mt*(1-mt) + nb.x*mt*mt;
      const py = na.y*(1-mt)*(1-mt) + my*2*mt*(1-mt) + nb.y*mt*mt;
      const dc = Math.hypot(px-CX, py-CY);
      const df = Math.max(0, 1 - dc/285);
      const pr = 6 + waveAmp*3;
      const pg = ctx.createRadialGradient(px,py,0, px,py,pr);
      pg.addColorStop(0,   `rgba(255,255,255,${.92*df})`);
      pg.addColorStop(.30, `rgba(${csA},${.75*df})`);
      pg.addColorStop(1,   'rgba(240,244,248,0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
    });
    drawn++;
  });

  // Dendrites with wobble
  NEURONS.forEach(n => {
    const distC = Math.hypot(n.x-CX, n.y-CY);
    const fade  = Math.max(0, 1 - distC/285);
    if (fade < .03) return;
    const fireG = (n.firing>0 && n.firing<1) ? Math.sin(n.firing*Math.PI) : 0;
    const alpha = (.08 + fireG*.30) * fade;

    n.dendrites.forEach(d => {
      const wobble = Math.sin(t*spd*.7 + n.phase + d.a) * waveAmp * 2;
      const ex = n.x + Math.cos(d.a + wobble*.04) * d.len;
      const ey = n.y + Math.sin(d.a + wobble*.04) * d.len;
      ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(ex, ey);
      ctx.strokeStyle = `rgba(${csA},${alpha})`; ctx.lineWidth = .5; ctx.stroke();
      d.subs.forEach(sb => {
        const smx = n.x + Math.cos(d.a)*d.len*.48;
        const smy = n.y + Math.sin(d.a)*d.len*.48;
        ctx.beginPath(); ctx.moveTo(smx, smy);
        ctx.lineTo(smx + Math.cos(sb.da + wobble*.06)*sb.dl,
                   smy + Math.sin(sb.da + wobble*.06)*sb.dl);
        ctx.strokeStyle = `rgba(${csA},${alpha*.5})`; ctx.lineWidth = .28; ctx.stroke();
      });
    });
  });

  // Cell bodies — sorted back→front by firing
  NEURONS
    .slice()
    .sort((a,b) => a.firing - b.firing)
    .forEach(n => {
      const distC = Math.hypot(n.x-CX, n.y-CY);
      const fade  = Math.max(0, 1 - distC/280);
      if (fade < .03) return;
      const isFiring = n.firing > 0 && n.firing < 1;
      const fireG    = isFiring ? Math.sin(n.firing*Math.PI) : 0;
      const pulse    = .28 + Math.sin(t*spd*n.fireSpd + n.phase) * waveAmp * .32;
      const sz       = n.sz * (.42 + pulse*.48 + fireG*.85);
      const alpha    = Math.min(.95, (.22 + pulse*.32 + fireG*.7) * fade);

      if (fireG > .05) {
        const r1 = sz * 7 * (1 + waveAmp*.3);
        const fg = ctx.createRadialGradient(n.x,n.y,0, n.x,n.y,r1);
        fg.addColorStop(0,   `rgba(255,255,255,${fireG*.50*fade})`);
        fg.addColorStop(.25, `rgba(${csA},${fireG*.35*fade})`);
        fg.addColorStop(.60, `rgba(${csB},${fireG*.10*fade})`);
        fg.addColorStop(1,   'rgba(240,244,248,0)');
        ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(n.x,n.y,r1,0,Math.PI*2); ctx.fill();
      }

      ctx.beginPath(); ctx.arc(n.x, n.y, Math.max(.4, sz*.78), 0, Math.PI*2);
      ctx.fillStyle = isFiring
        ? `rgba(255,255,255,${alpha})`
        : `rgba(${csA},${alpha})`;
      ctx.fill();
    });

  // Core glow — breathes
  const corePulse = .7 + Math.sin(t*3.2) * waveAmp * .4;
  [[80,.016],[50,.035],[28,.08],[14,.18],[6,.38],[2.5,.88]].forEach(([r,a]) => {
    const g = ctx.createRadialGradient(CX,CY,0, CX,CY,r*corePulse);
    g.addColorStop(0, `rgba(${csA},${a*corePulse})`);
    g.addColorStop(1, 'rgba(240,244,248,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX,CY,r*corePulse,0,Math.PI*2); ctx.fill();
  });
  ctx.beginPath(); ctx.arc(CX,CY,2.4,0,Math.PI*2);
  ctx.fillStyle = `rgba(255,255,255,${.82+Math.sin(t*4.5)*.18})`; ctx.fill();
}

frame();
</script>
</body>
</html>
